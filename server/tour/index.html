<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A look inside Kauzl</title>
<meta name="description" content="Click through Kauzl with sample data: the Story, Timeline, Search, Traffic, Journeys and Goals.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: a short proposal page wrapped around one live prototype (before/after, desktop/phone). Kauzl's own app tokens. */
:root {
  --bg: #f6f6f4; --surface: #fcfcfb; --surface-2: #f0efec; --hover: #f3f2ef;
  --border: #e4e3de; --border-strong: #cfcdc6;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #6b6a65;
  --accent: #0f766e; --accent-ink: #0b5e57; --accent-soft: #dcefeb; --on-accent: #fff;
  --amber: #F5A524; --ink: #121522; --owl: #F6F7F9;
  --up: #1baf7a; --down: #e34948; --s1: #0f766e; --s2: #eb6834; --s3: #6250d6; --s4: #e87ba4; --s5: #eda100; --s6: #2b7fd0; --s7: #9a5b2e; --s8: #8a8984;
  --good: #006300; --bad: #b42828; --warn-ink: #8a5a00; --warn-soft: #fbf0d9; --bad-soft: #f8e3e3;
  --scrim: rgba(10,10,9,.28); --shadow: 0 10px 30px rgba(20,20,10,.12), 0 1px 3px rgba(20,20,10,.08);
  --font: "Inter", ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Space Grotesk", "Inter", ui-sans-serif, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --hover: #242422;
  --border: #2d2d2a; --border-strong: #3d3d39;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86;
  --accent: #2fa596; --accent-ink: #7fd1c4; --accent-soft: #13302c; --on-accent: #06201c;
  --good: #4cc44c; --bad: #e66767; --warn-ink: #f2c45a; --up: #199e70; --down: #e66767; --s1: #2fa596; --s2: #d95926; --s3: #9085e9; --s4: #d55181; --s5: #c98500; --s6: #5a9fe3; --s7: #c07a48; --s8: #77766f; --warn-soft: #3a2f14; --bad-soft: #3a1d1d;
  --scrim: rgba(0,0,0,.55); --shadow: 0 10px 30px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --hover: #242422;
  --border: #2d2d2a; --border-strong: #3d3d39;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86;
  --accent: #2fa596; --accent-ink: #7fd1c4; --accent-soft: #13302c; --on-accent: #06201c;
  --good: #4cc44c; --bad: #e66767; --warn-ink: #f2c45a; --up: #199e70; --down: #e66767; --s1: #2fa596; --s2: #d95926; --s3: #9085e9; --s4: #d55181; --s5: #c98500; --s6: #5a9fe3; --s7: #c07a48; --s8: #77766f; --warn-soft: #3a2f14; --bad-soft: #3a1d1d;
  --scrim: rgba(0,0,0,.55); --shadow: 0 10px 30px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 40px 80px; }
.wrap { max-width: 1200px; margin: 0 auto; display: grid; gap: 56px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.08; }
h2 { font-size: 24px; line-height: 1.2; }
p { margin: 0; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); display: flex; align-items: center; gap: 8px; }
.lede { font-size: 18px; color: var(--text-2); max-width: 64ch; }
.muted { color: var(--text-3); }
section { display: grid; gap: 18px; }
.sec-head { display: grid; gap: 6px; max-width: 70ch; }
.sec-head p { color: var(--text-2); }
code { font-family: var(--mono); font-size: 13px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Numbers */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; }
.stat .n { font-family: var(--display); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 8px; }
.stat .n s { color: var(--text-3); font-weight: 500; font-size: 20px; text-decoration-thickness: 2px; }
.stat .n b { color: var(--accent-ink); font-weight: 600; }
.stat span { font-size: 13px; color: var(--text-2); }

/* Findings */
.finds { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.finds li { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: grid; gap: 6px; align-content: start; }
.finds b { font-size: 15px; }
.finds p { font-size: 14px; color: var(--text-2); }

/* Prototype controls */
.proto-bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 7px; font-size: 14px; font-weight: 500; color: var(--text-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.hint { font-size: 13px; color: var(--text-3); }
.stage { overflow-x: auto; padding: 4px 2px 12px; }
.stage.phone { display: flex; justify-content: center; }

/* ---------- The mock app ---------- */
.app { background: var(--bg); border: 1px solid var(--border-strong); border-radius: 14px; overflow: hidden; position: relative; font-size: 13.5px; text-align: left; }
.app.d { display: grid; grid-template-columns: 232px minmax(0, 1fr); height: 720px; min-width: 940px; }
.app.p { width: 375px; max-width: 100%; height: 740px; border-radius: 34px; border: 8px solid var(--ink); display: flex; flex-direction: column; flex: none; }
.ico { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.logo { flex: none; display: block; }

.sb { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; padding: 12px 10px; min-height: 0; overflow-y: auto; position: relative; }
.scope { display: flex; align-items: center; gap: 10px; width: 100%; border: 1px solid var(--border); background: var(--bg); border-radius: 10px; padding: 7px 8px; cursor: pointer; text-align: left; }
.scope:hover { border-color: var(--border-strong); }
.scope .who { display: grid; min-width: 0; flex: 1; line-height: 1.25; }
.scope .who b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scope .who small { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 5px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); display: inline-block; flex: none; }
.dot.on { background: #1baf7a; box-shadow: 0 0 0 3px color-mix(in srgb, #1baf7a 25%, transparent); }
.jump { display: flex; align-items: center; gap: 8px; width: 100%; border: 1px solid var(--border); background: transparent; border-radius: 8px; padding: 6px 9px; color: var(--text-3); cursor: pointer; font-size: 13px; }
.jump kbd { margin-left: auto; font: 11px var(--mono); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
.nav { display: grid; gap: 1px; }
.item { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 7px; color: var(--text-2); background: transparent; border: 0; width: 100%; text-align: left; cursor: pointer; font-size: 13.5px; }
.item:hover { background: var(--hover); color: var(--text); }
.item.on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.item .count { margin-left: auto; font-size: 11.5px; font-weight: 600; background: var(--surface-2); color: var(--text-2); border-radius: 999px; padding: 0 7px; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 4px; }
.item.on .count { background: var(--surface); }
.sub { display: grid; gap: 0; margin: 2px 0 6px 17px; padding-left: 10px; border-left: 1px solid var(--border); }
.sub .grp { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); padding: 8px 8px 2px; }
.sub .item { padding: 5px 8px; font-size: 13px; }
.sub .item.on { background: transparent; color: var(--accent-ink); }
.sb-foot { margin-top: auto; display: grid; gap: 4px; position: relative; }
.me { display: flex; align-items: center; gap: 9px; border: 0; background: transparent; border-radius: 8px; padding: 6px 8px; width: 100%; cursor: pointer; text-align: left; }
.me:hover { background: var(--hover); }
.avatar { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 25%, var(--surface-2)); font-weight: 600; font-size: 12px; flex: none; }
.me .who { display: grid; line-height: 1.2; min-width: 0; }
.me .who small { font-size: 11.5px; color: var(--text-3); display: flex; gap: 5px; align-items: center; }

.pop { position: absolute; z-index: 20; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; display: grid; gap: 1px; }
.pop.scopes { top: 58px; left: 10px; right: -150px; }
.pop.user { bottom: 46px; left: 0; right: 0; }
.pop .row { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 7px; border: 0; background: transparent; cursor: pointer; width: 100%; text-align: left; font-size: 13.5px; }
.pop .row:hover { background: var(--hover); }
.pop .row.on { background: var(--accent-soft); }
.pop .row .meta { margin-left: auto; font-size: 12px; color: var(--text-3); display: flex; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.pop .row .gear { padding: 4px; border-radius: 6px; color: var(--text-3); display: grid; }
.pop .row .gear:hover { background: var(--surface-2); color: var(--text); }
.pop hr { border: 0; border-top: 1px solid var(--border); margin: 4px 2px; }
.pop .lab { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); padding: 6px 8px 2px; }

.main { overflow-y: auto; min-height: 0; padding: 22px 26px 30px; display: flex; flex-direction: column; gap: 14px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px; }
.head h3 { font-size: 22px; }
.head .crumb { font-size: 12.5px; color: var(--text-3); display: flex; gap: 6px; align-items: center; margin-bottom: 2px; }
.head .crumb button { border: 0; background: none; padding: 0; color: var(--accent-ink); cursor: pointer; font-size: 12.5px; }
.head .sub2 { font-size: 13px; color: var(--text-3); }
.head-r { display: flex; gap: 8px; align-items: center; }
.mini-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; padding: 2px; background: var(--surface); }
.mini-seg button { border: 0; background: transparent; padding: 3px 9px; border-radius: 6px; font-size: 12.5px; color: var(--text-2); cursor: pointer; }
.mini-seg button.on { background: var(--surface-2); color: var(--text); font-weight: 600; }
.icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; width: 30px; height: 30px; display: grid; place-items: center; cursor: pointer; color: var(--text-2); flex: none; }
.icon-btn:hover { color: var(--text); border-color: var(--border-strong); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }
.card h4 { margin: 0; font-size: 13px; font-weight: 600; color: var(--text-2); }
.big { font-size: 16px; line-height: 1.45; }
.big b.up { color: var(--good); }
.big b.down { color: var(--bad); }
.needs { display: flex; align-items: center; gap: 10px; background: var(--warn-soft); border-radius: 10px; padding: 10px 14px; border: 0; cursor: pointer; text-align: left; width: 100%; font-size: 13.5px; }
.needs .go { margin-left: auto; color: var(--accent-ink); font-weight: 600; white-space: nowrap; }
.rows { display: grid; gap: 2px; }
.r { display: grid; grid-template-columns: minmax(0, 1fr) 70px 58px; gap: 10px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
.r:last-child { border-bottom: 0; }
.r span:nth-child(2), .r span:nth-child(3) { text-align: right; }
.up { color: var(--good); } .down { color: var(--bad); }
.linkish { border: 0; background: none; padding: 0; color: var(--accent-ink); font-weight: 600; cursor: pointer; font-size: 13px; justify-self: start; }
.sitecard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; cursor: pointer; text-align: left; width: 100%; }
.sitecard:hover { border-color: var(--border-strong); }
.sitecard .nm { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.sitecard .ln { color: var(--text-2); font-size: 13px; grid-column: 1; }
.sitecard .num { grid-row: 1 / 3; grid-column: 2; text-align: right; font-variant-numeric: tabular-nums; display: grid; }
.sitecard .num b { font-size: 17px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; cursor: pointer; color: var(--text-2); white-space: nowrap; }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.inbox { display: grid; gap: 6px; }
.msg { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 4px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.msg .k { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; grid-row: 1 / 3; }
.msg .k.alert { background: var(--bad-soft); color: var(--bad); }
.msg .k.todo { background: var(--accent-soft); color: var(--accent-ink); }
.msg small { color: var(--text-3); font-size: 12px; }
.msgb { text-align: left; cursor: pointer; color: var(--text); font: inherit; width: 100%; }
.msgb:hover, .msgb.on { border-color: var(--accent); }
.tpill { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 8px; background: var(--surface-2); color: var(--text-2); vertical-align: 1px; white-space: nowrap; }
.tpill.warn { background: color-mix(in srgb, var(--warn-ink) 14%, var(--surface)); color: var(--warn-ink); }
.tpill.up { background: color-mix(in srgb, var(--up) 12%, var(--surface)); color: var(--up); }
.tpanel { gap: 14px; }
.ixsum { display: grid; gap: 10px; }
.ixbar { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 14px; align-items: center; }
.ixbl { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
.ixbl .muted { font-size: 12px; }
.ixtrack { display: flex; gap: 2px; height: 12px; border-radius: 4px; overflow: hidden; }
.ixtrack i { display: block; }
.ixtrack i.ok { background: color-mix(in srgb, var(--up) 55%, var(--surface)); }
.ixtrack i.warn { background: var(--warn-ink); }
.ixtrack i.bad { background: var(--down); }
.ixtrack i.off { background: var(--border-strong); }
.ixlist { padding-top: 4px; padding-bottom: 4px; }
.ixrow { display: grid; grid-template-columns: minmax(0, 1fr) 120px 120px 14px; gap: 12px; align-items: center; border: 0; border-top: 1px solid var(--border); background: none; padding: 10px 2px; width: 100%; text-align: left; cursor: pointer; color: var(--text); font: inherit; }
.ixrow:first-child { border-top: 0; }
.ixrow:hover, .ixrow.on { background: var(--hover); }
.ixrow > .ico { color: var(--text-3); }
.ixe { display: grid; gap: 2px; justify-items: start; }
.ixe small { font-size: 10.5px; color: var(--text-3); }
.ixp { font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.ixp.ok { color: var(--up); background: color-mix(in srgb, var(--up) 11%, var(--surface)); }
.ixp.warn { color: var(--warn-ink); background: color-mix(in srgb, var(--warn-ink) 13%, var(--surface)); }
.ixp.bad { color: var(--down); background: color-mix(in srgb, var(--down) 11%, var(--surface)); }
.ixp.off { color: var(--text-3); background: var(--surface-2); }
.ixaddr { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 6px 10px; align-items: baseline; }
.ixaddr code { font: 11.5px var(--mono); word-break: break-all; }
.ixaddr code.diff { color: var(--warn-ink); font-weight: 600; }
.ixeng { display: grid; gap: 4px; padding: 6px 0; }
.ixeh { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.ixeng code { font: 11px var(--mono); color: var(--text-2); background: var(--surface-2); border-radius: 6px; padding: 5px 8px; }
.ixnote { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; border: 0; border-radius: 10px; background: color-mix(in srgb, var(--warn-ink) 9%, var(--surface)); padding: 10px 12px; font: inherit; font-size: 13px; color: var(--text-2); cursor: pointer; }
.ixnote b { color: var(--text); }
.ixnote .ico { color: var(--warn-ink); margin-top: 2px; flex-shrink: 0; }
.ixnote .go { margin-left: auto; color: var(--accent-ink); font-weight: 600; white-space: nowrap; }
.app.p .ixbar { grid-template-columns: 1fr; gap: 6px; }
.app.p .ixrow { grid-template-columns: minmax(0, 1fr) auto auto; row-gap: 6px; }
.app.p .ixrow .lname { grid-column: 1 / -1; }
.app.p .ixrow > .ico { display: none; }
.app.p .ixe { grid-auto-flow: column; align-items: center; gap: 6px; }
.ymltag { display: inline-flex; align-items: center; gap: 3px; font: 10.5px var(--mono); color: var(--text-3); background: var(--surface-2); border: 0; border-radius: 5px; padding: 2px 6px; cursor: pointer; white-space: nowrap; vertical-align: 1px; }
.ymltag:hover { color: var(--accent-ink); background: var(--accent-soft); }
.ymltag.static { cursor: default; }
.jsrc { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin: 12px 0 0; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12px; }
.ysrc { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.ysrc code { font: 12.5px var(--mono); }
.app.p .ysrc { grid-template-columns: 32px minmax(0, 1fr); }
.app.p .ysrc .chips { grid-column: 1 / -1; flex-wrap: nowrap; overflow-x: auto; }
.ymapc { padding-top: 4px; padding-bottom: 4px; }
.ymap { display: grid; grid-template-columns: minmax(0, 1fr) 20px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 6px; border-top: 1px solid var(--border); }
.ymap:first-child { border-top: 0; }
.ymap.on { background: var(--accent-soft); border-radius: 8px; }
.ymap.on + .ymap { border-top-color: transparent; }
.ymk { display: grid; gap: 1px; border: 0; background: none; text-align: left; cursor: pointer; padding: 0; color: var(--text); font: inherit; }
.ymk code { font: 600 12.5px var(--mono); }
.ymk small { font-size: 11.5px; color: var(--text-3); }
.yarr { color: var(--text-3); text-align: center; }
.ywhere { justify-self: start; font-size: 13px; text-align: left; }
.ycode { padding: 8px 0; overflow-x: auto; }
.yblk { padding: 2px 0; border-radius: 0; }
.yblk.on { background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
.yl { display: grid; grid-template-columns: 40px max-content; align-items: baseline; font: 12px/1.65 var(--mono); }
.yl i { font-style: normal; color: var(--text-3); text-align: right; padding-right: 12px; user-select: none; font-size: 11px; }
.yl code { font: inherit; white-space: pre; color: var(--text); }
.yl em { grid-column: 2; font: 11px var(--sans, inherit); font-style: normal; color: var(--warn-ink); display: inline-flex; gap: 4px; align-items: center; padding: 0 0 4px; }
.yl.warn code { text-decoration: underline wavy var(--warn-ink); text-underline-offset: 3px; }
.yk { color: var(--accent-ink); }
.yl code, .ymk code, .ysrc code { background: none; padding: 0; border-radius: 0; }
.ycm { color: var(--text-3); }

.wpg small { margin-left: auto; font-size: 10px; font-weight: 700; flex: none; }

.tn { display: flex; gap: 7px; align-items: flex-start; min-width: 0; }

.tsp { width: 100%; height: 26px; display: block; }
.tv, .tc { text-align: right; }
.tt { font-size: 11.5px; font-weight: 600; }

.app.p .trow .tv, .app.p .trow .tc { display: none; }
.tl-split { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
.map { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; min-width: 0; }

.cmp { justify-self: start; }

.cmp button { font-size: 11.5px; padding: 2px 7px; }
.dtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 4px; overflow-x: auto; }
.dtabs button { border: 0; background: none; padding: 5px 8px; font-size: 12.5px; color: var(--text-2); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.dtabs button.on { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }
/* A page told as one timeline */
.tl { list-style: none; margin: 4px 0 0; padding: 0; display: grid; }
.tlm { display: grid; grid-template-columns: 56px 22px minmax(0, 1fr); column-gap: 8px; position: relative; }
.tlm::before { content: ""; position: absolute; left: 74px; top: 0; bottom: 0; width: 2px; background: var(--border); }
.tlm:first-child::before { top: 14px; }
.tlnow::before { bottom: auto; height: 14px; }
.tld { font-size: 12px; color: var(--text-3); padding-top: 9px; text-align: right; font-variant-numeric: tabular-nums; }
.tlnow .tld { color: var(--accent-ink); font-weight: 700; }
.tlic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1.5px solid var(--border-strong); color: var(--text-2); margin-top: 6px; position: relative; z-index: 1; }
.tlm.t-up .tlic { border-color: var(--up); color: var(--up); }
.tlm.t-down .tlic { border-color: var(--down); color: var(--down); }
.tlm.t-warn .tlic { border-color: var(--warn-ink); color: var(--warn-ink); }
.tlic.k-now { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }

/* Changes table */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 14px; }
th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-3); background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
td:first-child { font-weight: 600; white-space: nowrap; }

/* Build order */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; counter-increment: s; }
.steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--amber); font-weight: 700; font-size: 13px; grid-row: 1 / 3; }

.steps .f { grid-column: 3; grid-row: 1; font: 12px var(--mono); color: var(--text-3); white-space: nowrap; }
.asks { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.ask { border: 1px dashed var(--border-strong); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; }
.ask p { font-size: 14px; color: var(--text-2); }
@media (max-width: 560px) {
  .steps li { grid-template-columns: 32px minmax(0, 1fr); }
  .steps .f { grid-column: 2; grid-row: auto; white-space: normal; }
}
@media (prefers-reduced-motion: no-preference) {
  .pop, .sheet, .cmd { animation: pop .14s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } }
  .cmd { animation: none; }
}
