[package]
name = "sitelens-studio"
version = "0.2.0"
description = "SiteLens Studio: product analytics workspace"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
