# SiteLens Studio, hosted. One machine and one volume: SQLite lives on the
# volume, so this must never scale past one machine. See docs/hosting.md.
app = "sitelens-studio"
primary_region = "sin"

[build]

[env]
  STUDIO_HOST = "sitelens.kazekit.com"
  STUDIO_DATA_DIR = "/data"
  PORT = "8080"

[[mounts]]
  source = "sitelens_data"
  destination = "/data"
  snapshot_retention = 14

[http_service]
  internal_port = 8080
  force_https = true
  # Background syncs and alerts run in-process, so keep the machine up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
