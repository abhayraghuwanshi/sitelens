# SiteLens Studio, hosted. One machine and one volume: SQLite lives on the
# volume, so this must never scale past one machine. See docs/hosting.md.
app = "sitelens-studio"
primary_region = "sin"

[build]

[env]
  STUDIO_HOST = "kauzl.com"
  STUDIO_OLD_HOSTS = "sitelens.kazekit.com,www.kauzl.com"
  STUDIO_DATA_DIR = "/data"
  PORT = "8080"
  # The free tools (tools/), deployed to Vercel and shown at kauzl.com/tools/.
  TOOLS_ORIGIN = "https://kauzl-tools.vercel.app"
  # Google Tag Manager on the public home page (tools/site.config.json does the tools and guides).
  GOOGLE_TAG_ID = "GTM-MB52Q4DR"

[[mounts]]
  source = "sitelens_data"
  destination = "/data"
  snapshot_retention = 14

[http_service]
  internal_port = 8080
  force_https = true
  # Background syncs and alerts run in-process, so keep the machine up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
